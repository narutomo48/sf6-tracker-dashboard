<title>SF6 Tracker</title>
<style>
:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --text: #ffffff;
  --text-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --accent: #fab219;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --loss: #5a5955;
  --up: #0ca30c; --down: #e66767;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec;
    --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --accent: #b97c00;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --loss: #c3c2b7; --up: #006300; --down: #d03b3b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
header h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
header h1 span { color: var(--accent); }
.meta { color: var(--muted); font-size: 12px; }
.alert { margin: 12px 0 0; padding: 10px 14px; border-radius: 8px; border: 1px solid #d03b3b;
  background: color-mix(in srgb, #d03b3b 12%, transparent); font-size: 13px; }
.alert b::before { content: "⚠ "; }

.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 16px 0 12px; }
.filters label { color: var(--text-2); font-size: 12px; margin-right: 6px; }
select, .seg button { font: inherit; font-size: 13px; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; cursor: pointer; background: transparent; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }

.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--axis); margin-top: 4px; }
.tab { font: inherit; font-weight: 600; letter-spacing: .03em; background: none; border: 0; color: var(--text-2);
  padding: 8px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab.add { color: var(--muted); font-weight: 400; }
.picker { position: relative; }
.picker-panel { position: absolute; z-index: 20; top: 100%; left: 0; min-width: 260px; max-height: 420px; overflow: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.picker-panel label { display: flex; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
.picker-panel label:hover { background: var(--surface-2); }
.picker-panel .sub { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.picker-panel .hint { color: var(--muted); font-size: 12px; padding: 4px 6px 8px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.kpi .k { color: var(--text-2); font-size: 12px; }
.kpi .v { font-size: 26px; font-weight: 650; line-height: 1.25; margin-top: 2px; }
.kpi .d { font-size: 12px; color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 2px; }
.card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend i.box { height: 10px; width: 10px; border-radius: 2px; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

.tip { position: absolute; pointer-events: none; z-index: 10; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.tip .t { color: var(--muted); margin-bottom: 2px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r span { color: var(--text-2); }
.tip i { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }

.axis text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.endlabel { font-size: 11px; fill: var(--text-2); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text-2); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
th:first-child, td:first-child { text-align: left; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
td { font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tr.sel td:first-child { font-weight: 650; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; background: transparent; border: 1px solid var(--axis); }
.bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--s1); vertical-align: middle; margin-left: 6px; }
.tablewrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>

  const maxB = Math.max(1, ...rivalRows.map(r => r.b));
  const drawTable = () => tableBox.replaceChildren(sortableTable([
    { key: "name", label: "相手キャラ", text: true, render: r => [h("span", { class: "swatch", style: sel.includes(r.rv) ? `background:${colorOf(r.rv)};border-color:${colorOf(r.rv)}` : null }), r.name] },
    { key: "b", label: "対戦数", render: r => [fNum(r.b), h("span", { class: "bar", style: `width:${Math.round(40 * r.b / maxB)}px` })] },
    { key: "wr", label: "勝率", render: r => fPct(r.wr) },
    { key: "pb", label: "期間 対戦", render: r => r.pb ? fNum(r.pb) : "—" },
    { key: "pwr", label: "期間 勝率", render: r => r.pb ? `${fPct(r.pwr)}（${r.pw}勝）` : "—" },
    { key: "dwr", label: "勝率変化", render: r => fSigned(r.dwr, 1, "pt"), cls: r => cls(r.dwr, 1) },
    { key: "spark", label: "推移", render: r => sparkline(r.cum) },
  ], rivalRows, { sortKey: "b", rowClass: r => sel.includes(r.rv) ? "sel" : null, onRow: r => {
      if (sel.includes(r.rv)) sel = sel.filter(x => x !== r.rv);
      else { if (sel.length >= 4) sel = sel.slice(1); sel = [...sel, r.rv]; }
      state.rivals[c] = sel; save(); drawRivalChart(); drawTable();
    } }));
  drawTable();
  if (!rivalRows.length) tableBox.replaceChildren(h("div", { class: "empty" }, "このActのランクマ対戦はまだありません"));
}

// ------------------------------------------------------------ main
function renderMain() {
  const main = document.getElementById("main");
  main.replaceChildren();
  const n = seasonDates(state.season).length;
  if (n === 1) main.append(h("div", { class: "note", style: "margin-top:12px" },
    "記録はまだ1日分です。2日目以降の取得から、日別の対戦数・期間内の成績・推移のグラフが表示されます。"));
  if (state.active === "overview") renderOverview(main); else renderChar(main, state.active);
}
function render() { renderHeader(); renderTabs(); renderMain(); }
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(renderMain, 150); });
render();
</script>
</body>
</html>
