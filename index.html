* { box-sizing: border-box; }

// ------------------------------------------------------------ memo（Google スプレッドシート）
const memo = { key: store.get("memoKey", ""), list: store.get("memoCache", []), status: "", err: false, busy: false, loaded: false };
const memoOn = () => !!D.memo_api;
const pad2 = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const playDate = () => ymd(new Date(Date.now() - 6 * 3600e3));  // 朝6時までは前日扱い
const wd = d => "日月火水木金土"[new Date(d + "T00:00:00").getDay()];
// メモの日付 → その日の対戦が入っている取得日（メモの日より後の最初の取得）
const snapFor = d => (D.snapshot_dates || []).find(x => x > d) || null;
function notesFor(dates) {
  return dates.map(d => {
    const ms = memo.list.filter(m => snapFor(m.date) === d).sort((a, b) => a.date.localeCompare(b.date));
    return ms.length ? ms : null;
  });
}
function setMemoList(list) { memo.list = list || []; store.set("memoCache", memo.list); }
async function memoCall(body) {
  const url = body ? D.memo_api : D.memo_api + "?key=" + encodeURIComponent(memo.key);
  const r = await fetch(url, body ? { method: "POST", body: JSON.stringify({ key: memo.key, ...body }) } : {});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "エラー");

}
async function memoLoad() {
  if (!memoOn() || !memo.key) return;
  memo.busy = true;
  try { await memoCall(); memo.status = ""; memo.err = false; memo.loaded = true; }
  catch (e) {
    memo.status = "メモを読み込めませんでした: " + e.message; memo.err = true;

}

function snapStats(snap) {
  // その取得日に入った対戦（前回取得との差）と MR の変化
  const all = D.snapshot_dates || [], i = all.indexOf(snap), prev = i > 0 ? all[i - 1] : null;
  const out = { battles: null, wins: null, mr: [] };
  if (!prev) return out;
  for (const se of Object.keys(D.winrates)) {
    const rows = D.winrates[se].all || [];
    if (rows.some(r => r[0] === snap) && rows.some(r => r[0] === prev)) {
      const [b1, w1] = valAt(rows, snap), [b0, w0] = valAt(rows, prev);
      out.battles = b1 - b0; out.wins = w1 - w0;
